<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>

    <form action="form07.php" method="post" autocomplete="on">
        <p>
           <label for="iest">Estado</label>
              <select name="estado" id="iest">
                <option value="" selected>Selecione um estado</option>
                <optgroup label="Região Sudeste">
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="SP">São Paulo</option>
                    <option value="MG">Minas Gerais</option>
                </optgroup>
                
                <optgroup label="Região Nordeste">
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="CE">Ceará</option>
                    <option value="PE">Pernambuco</option>
                </optgroup>

              </select>
        </p>

        <p>
            <label for="iprof">Profissão</label>
            <input list="profissoes" name="profissao" id="iprof" placeholder="Digite sua profissão">
            <datalist id="profissoes">
                <option value="Programador">
                <option value="Designer">
                <option value="Analista de Sistemas">
                <option value="Gerente de Projetos">
                <option value="Outra"></option>    
            </datalist>
        </p>

          <p>
            <label for="imsg">Mensagem</label>
            <textarea name="mensagem" id="imsg" rows="4" cols="50" placeholder="Deixe sua mensagem"></textarea>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

      
       
    </form>
</body>
</html>
