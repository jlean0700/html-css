<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>

    <form action="cadastro.php" method="get" autocomplete="on">

        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="imasc" checked value="masculino">
            <label for="imasc">Masculino</label>
<br> <hr>
            <input type="radio" name="sexo" id="ifem" value="feminino">
            <label for="ifem">Feminino</label>
        </fieldset>
<br> <br>
        <fieldset>
            <legend>Esportes Favoritos</legend>
            <input type="checkbox" name="esfut" id="iesfut" checked>
            <label for="iesfut">Futebol</label>
<br> <hr>
            <input type="checkbox" name="esbasq" id="iesbasq">
            <label for="iesbasq">Basquete</label>
<br> <hr>
            <input type="checkbox" name="esvolei" id="iesvolei">
            <label for="iesvolei">Vôlei</label>
<br> <hr>
            <input type="checkbox" name="esoutros" id="iesoutros" checked>
            <label for="iesoutros">Outros</label>

        </fieldset>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>

</body>
</html>
