<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <h1>Formulário</h1> 

   <form action="form08.php" method="post">
   
    <p>
        <label for="in1">Numero1:</label>
        <input type="number" name="n1" id="in1" min="0" max="50" required oninput="isoma.innerHTML = Number(in1.value) + Number(n2.value)">
        
    </p>

    <p>
        <label for="in2">Numero2:</label>
        <input type="number" name="n2" id="n2" min="0" max="50" required oninput="isoma.innerHTML = Number(in1.value) + Number(n2.value)">
        
    </p>

    <p>
        <label for="isoma">Soma:</label>
        <output id="isoma" name="soma"></output>
    </p>

    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>



   </form>
   
</body>
</html>
