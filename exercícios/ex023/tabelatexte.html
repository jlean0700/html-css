<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>testando tabela</title>

    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: red;
        }

        table {

           width: 500px;
           border-collapse: collapse;
           background-color: gray;
           max-width: 90vw;
        }

        td, th {
            text-align: center;
            border: 1px solid black;
            padding: 10px;
        }

        tfoot {
            background-color: gray;
            color: white;
        }

        .nada {
            background-color: red;
            color: red;
        }

    </style>

</head>
<body>

    <table>
        <thead>
            <th>Posiçao</th>
            <th>Estado</th>
            <th>População</th>
        </thead>

        <tbody>
            <tr>
                <td>1</td>
                <td>São Paulo</td>
                <td>46 081 801</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Minas Gerais</td>
                <td>21 393 441</td>
            
        </tbody>

        <tfoot>
            <th class="nada"></th>
			<th>Total de Habitantes</th>
			<td>213 421 037</td>
		</tfoot>
        
    </table>
    
</body>
</html>
