<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafios</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            text-align: center;
            border-collapse: collapse;
            padding: 10px;
            width: 550px;
        }

        thead th {
            color: white;
        }

        tbody .branco {
            background-color: white;
        }

        .media {
            color: white;
            text-align: justify;
        }

        .notas {
            background-color: gray;
            color: white;
        }

        th {
            border: 1px solid black;
            padding: 10px;
            font-size: 1..3em;
            font-weight: bold;
            background-color: gray;
        }

        td {
            border: 1px solid black;
            padding: 10px;
         }

    </style>
</head>
<body>
    
    <table>
        <thead>
            <tr>
                <th rowspan="2" scope="colgroup">Área</th>
                <th rowspan="2" scope="colgroup">Disciplinas</th>
                <th colspan="2" scope="colgroup">Notas</th>
                
                <th rowspan="2" scope="colgroup">Média</th>
            </tr>     

        <tr>
            
            
            <th scope="colgroup">Nota 1</th>
            <th scope="colgroup">Nota 2</th>
           
        </tr>
    </thead>

    <tbody>
        <tr>
            <th rowspan="4" class="branco">Exatas</th>
            <td>Matemática</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>

        <tr>
            
            <td>Física</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>

        <tr>
            
            <td>Química</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>

        <tr>
            
            <td>Biologia</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>

        <tr>
            <th colspan="4" scope="row" class="media">Média De Exatas</th>
            


            <td class="notas">0.0</td>
        </tr>

        <tr>
            <th rowspan="2" class="branco">Humanas</th>
            <td>História</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>

        <tr>
            
            <td>Geografia</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>

        <tr>
            <th colspan="4" scope="row" class="media">Média de Humanas</th>
          

            
            <td class="notas">0.0</td>
        </tr>    

    </tbody>
    </table>

</body>
</html>
